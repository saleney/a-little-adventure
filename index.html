<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Adventure — A Read-Aloud Story for Kids</title>
<meta name="description" content="A choose-your-own-way story for kids and their grown-ups.">
<style>
  :root {
    --paper: #fffaf0;
    --ink: #3f463d;
    --muted: #777b70;
    --green: #7fa57b;
    --green-dark: #567456;
    --yellow: #f3d77b;
    --blue: #8bb7c7;
    --pink: #e9a7a1;
    --purple: #aa9acb;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    background:
      radial-gradient(circle at 15% 15%, rgba(243,215,123,.22) 0 55px, transparent 56px),
      radial-gradient(circle at 86% 18%, rgba(139,183,199,.18) 0 70px, transparent 71px),
      var(--paper);
    color: var(--ink);
    font-family: "Trebuchet MS", "Avenir Next", system-ui, sans-serif;
  }

  .app {
    width: min(760px, 100%);
    min-height: 100vh;
    margin: 0 auto;
    padding: 22px 18px 28px;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }

  .brand {
    font-size: 15px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--green-dark);
    font-weight: 800;
  }

  .reset {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    padding: 7px 4px;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .screen {
    width: 100%;
    text-align: center;
    padding: 18px 4px;
    animation: appear .35s ease;
  }

  @keyframes appear {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .illustration {
    width: 118px;
    height: 118px;
    margin: 0 auto 18px;
    display: grid;
    place-items: center;
    font-size: 68px;
    border-radius: 50%;
    background: rgba(255,255,255,.55);
  }

  .eyebrow {
    color: var(--green-dark);
    font-size: 14px;
    font-weight: 800;
    letter-spacing: .06em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(38px, 8vw, 62px);
    line-height: .98;
    margin: 0 auto 16px;
    max-width: 650px;
    font-weight: 700;
  }

  .story {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(21px, 4.4vw, 28px);
    line-height: 1.4;
    max-width: 620px;
    margin: 0 auto 22px;
  }

  .small {
    max-width: 560px;
    margin: 0 auto 24px;
    font-size: 17px;
    line-height: 1.55;
    color: var(--muted);
  }

  .choices {
    width: min(620px, 100%);
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  button.choice {
    min-height: 116px;
    border: 1px solid rgba(63,70,61,.09);
    border-radius: 20px;
    background: rgba(255,255,255,.72);
    color: var(--ink);
    padding: 15px;
    font: inherit;
    font-size: 19px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 3px 14px rgba(70,70,50,.045);
    transition: transform .12s ease, background .12s ease;
  }

  button.choice:hover {
    transform: translateY(-2px);
    background: white;
  }

  button.choice:active {
    transform: translateY(1px);
  }

  .choice .emoji {
    display: block;
    font-size: 40px;
    margin-bottom: 6px;
  }

  .action {
    display: inline-block;
    border: 0;
    border-radius: 999px;
    background: var(--green);
    color: white;
    padding: 15px 28px;
    font: inherit;
    font-weight: 800;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--green-dark);
  }

  .action:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 var(--green-dark);
  }

  .adventure-note {
    margin-top: 20px;
    color: var(--muted);
    font-size: 13px;
  }

.offline {
    display: inline-block;
    margin-top: 16px;
    padding: 11px 15px;
    border-radius: 16px;
    background: #f8edc7;
    color: #6c613c;
    font-size: 15px;
    line-height: 1.4;
    max-width: 520px;
  }

  .prompt-deck {
    max-width: 520px;
    margin: 14px auto 0;
    padding: 15px;
    border: 2px solid var(--ink);
    border-radius: 18px 26px 16px 24px;
    background: rgba(255,255,255,.62);
  }

  .prompt-deck strong,
  .prompt-deck span { display: block; }
  .prompt-deck span { margin: 7px 0 12px; font: 1.08rem/1.35 Georgia, serif; }
  .prompt-more { border: 0; background: transparent; color: var(--ink); font: 700 11px "DM Mono", monospace; text-decoration: underline; cursor: pointer; padding: 5px; }


  .audio-row {
    display: flex;
    justify-content: center;
    margin: 8px auto 22px;
  }

  .listen {
    border: 1px solid rgba(63,70,61,.12);
    border-radius: 999px;
    background: rgba(255,255,255,.78);
    color: var(--ink);
    padding: 10px 17px;
    font: inherit;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }

  .listen:active {
    transform: scale(.98);
  }

  .choice .choice-text {
    display: block;
  }

  .talk-note {
    max-width: 560px;
    margin: 14px auto 0;
    color: var(--muted);
    font-size: 14px;
  }

  .mic {
    border: 0;
    border-radius: 999px;
    background: #f4e6ef;
    color: #78556b;
    padding: 12px 18px;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
  }

  footer {
    text-align: center;
    padding-top: 10px;
    color: #9a9b91;
    font-size: 12px;
  }

  @media (max-width: 520px) {
    .app {
      padding: 15px 14px 18px;
    }

    header {
      margin-bottom: 0;
    }

    main {
      align-items: flex-start;
    }

    .screen {
      padding: 12px 2px 10px;
    }

    .illustration {
      width: 92px;
      height: 92px;
      font-size: 52px;
      margin-bottom: 14px;
    }

    h1 {
      font-size: 40px;
    }

    .story {
      font-size: 23px;
      margin-bottom: 20px;
    }

    .small {
      font-size: 16px;
    }

    .choices {
      gap: 10px;
    }

    button.choice {
      min-height: 92px;
      font-size: 17px;
      border-radius: 18px;
      padding: 10px;
    }

    .choice .emoji {
      font-size: 32px;
    }
  }

const customMarks = ["✦","◌","△","〰","◇","＋","?","!"];
function customMark(text) {
  let total = 0;
  for (const char of String(text)) total += char.codePointAt(0);
  return customMarks[total % customMarks.length];
}

function normalizeAdventureChoices() {
  Object.values(endings).forEach(e => {
    e.nextChoices = e.nextChoices || [];
    e.nextResults = e.nextResults || [];
    while (e.nextResults.length < e.nextChoices.length) {
      const label = e.nextChoices[e.nextResults.length]?.[1] || "something unexpected";
      e.nextResults.push(`You chose ${label.toLowerCase()}. What do you think happens next?`);
    }
  });
}

normalizeAdventureChoices();

function render(html) {
  document.getElementById("main").innerHTML = `<section class="screen">${html}</section>`;
}

let currentAdventure = null;
let storyPromptIndex = 0;


function speak(text) {
  if (!("speechSynthesis" in window)) {
    alert("Audio is not available in this browser.");
    return;
  }

  window.speechSynthesis.cancel();

  const voices = window.speechSynthesis.getVoices();
  const englishVoices = voices.filter(v => /^en(?:-|_)/i.test(v.lang));
  const preferredNames = ["Ava", "Samantha", "Zoe", "Allison", "Evan", "Karen", "Moira"];
  const voiceScore = voice => {
    const name = voice.name.toLowerCase();
    let score = /en-US|en_US/i.test(voice.lang) ? 30 : 10;
    if (/premium|enhanced|natural|personal/i.test(name)) score += 100;
    const preferredIndex = preferredNames.findIndex(preferred => name.includes(preferred.toLowerCase()));
    if (preferredIndex >= 0) score += 50 - preferredIndex;
    if (/compact|eloquence|google/i.test(name)) score -= 20;
    return score;
  };
  const voice = englishVoices.sort((a, b) => voiceScore(b) - voiceScore(a))[0] || voices[0];

  const utterance = new SpeechSynthesisUtterance(text);
  if (voice) utterance.voice = voice;
  utterance.rate = 0.94;
  utterance.pitch = 1;
  utterance.volume = 1;

  window.speechSynthesis.speak(utterance);
}

if ("speechSynthesis" in window) {
  window.speechSynthesis.onvoiceschanged = () => {};
}

function speakChoice(result) {
  const e = endings[result];
  speak(e.story + " " + e.offline);
}

function speakAdventure(key) {
  const a = adventures[key];
  speak(a.intro + " " + a.question);
}

function speakHome() {
  speak("Where should we go? Pick a place together. Make some choices. See what happens.");
}

function speakEnding(result) {
  const e = endings[result];
  speak(e.story + " " + e.offline);
}

function home() {
  currentAdventure = null;
  storyPromptIndex = 0;
  render(`
    <div class="illustration">✦</div>
    <h1>Where should we go?</h1>
    <div class="audio-row">
      <button class="listen" onclick="speakHome()">hear it ↗</button>
    </div>
    <p class="small">Pick a place together. Make some choices. See what happens.</p>
    <div class="choices home-choices">
      ${Object.entries(adventures).map(([key, a]) => `
        <button class="choice" onclick="begin('${key}')">
          <span class="doodle ${key}" aria-hidden="true">${adventureMarks[key]}</span>${a.title}
        </button>
      `).join("")}
    </div>
  `);
}

function begin(key) {
  currentAdventure = key;
  storyPromptIndex = 0;
  const a = adventures[key];
  render(`
    <div class="illustration drawn-mark" aria-hidden="true">${adventureMarks[key]}</div>
    <p class="story">${a.intro}</p>
    <p class="story"><strong>${a.question}</strong></p>
    <div class="audio-row">
      <button class="listen" onclick="speakAdventure('${key}')">Hear the story</button>
    </div>
    <div class="choices">
      ${a.choices.map(([emoji, label, result]) => `
        <button class="choice" onclick="choose('${result}')">
          <span class="doodle mini" aria-hidden="true">${customMark(label)}</span>
          <span class="choice-text">${label}</span>
        </button>
      `).join("")}
    </div>
    <p class="talk-note">Tell your grown-up what you think happens next.</p>
  `);
}


function choose(result) {
  const e = endings[result];
  render(`
    <div class="illustration drawn-mark" aria-hidden="true">${customMark(e.story)}</div>
    <p class="story">${e.story}</p>
    <div class="audio-row">
      <button class="listen" onclick="speakEnding('${result}')">Hear it</button>
    </div>
    <div class="offline"><strong>One more little choice...</strong><br>${e.nextPrompt || "What should you do next?"}</div>
    <div class="choices" style="margin-top:14px">
      ${e.nextChoices.map((choice, choiceIndex) => `
        <button class="choice" onclick="nextStep('${result}', ${choiceIndex})">
          <span class="doodle mini" aria-hidden="true">${customMark(choice[1])}</span>
          <span class="choice-text">${choice[1]}</span>
        </button>
      `).join("")}
    </div>
    <div style="margin-top:24px">
      <button class="action" onclick="home()">Go on another adventure</button>
    </div>
  `);
}



function speakNextStep(result, choiceIndex) {
  const e = endings[result];
  const text = e.nextResults[choiceIndex] || "What do you think happens next?";
  speak(text);
}


function nextStep(result, choiceIndex) {
  const e = endings[result];
  const text = e.nextResults[choiceIndex];
  const offline = e.offline;
  const prompts = storyPrompts[currentAdventure] || [];

  render(`
    <div class="illustration drawn-mark" aria-hidden="true">${customMark(e.story)}</div>
    <p class="story">${text}</p>
    <div class="audio-row">
      <button class="listen" onclick="speakNextStep('${result}', ${choiceIndex})">Hear it</button>
    </div>
    <div class="offline">
      <strong>Now the adventure leaves the screen.</strong><br>${offline}
    </div>
    ${prompts.length ? `
      <div class="prompt-deck">
        <strong>Keep the story going.</strong>
        <span id="story-prompt">${prompts[0]}</span>
        <button class="prompt-more" onclick="anotherStoryPrompt()">another question ↻</button>
      </div>
    ` : ""}
    <div style="margin-top:24px">
      <button class="action" onclick="home()">Go on another adventure</button>
    </div>
  `);
}

function anotherStoryPrompt() {
  const prompts = storyPrompts[currentAdventure] || [];
  if (!prompts.length) return;
  storyPromptIndex = (storyPromptIndex + 1) % prompts.length;
  document.getElementById("story-prompt").textContent = prompts[storyPromptIndex];
}

function startOver() {
  window.speechSynthesis?.cancel();
  home();
}

home();
</script>
